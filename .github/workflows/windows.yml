name: Windows build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - name: Build libvirtualhid bridge
        shell: pwsh
        run: ./scripts/build-lvh-bridge.ps1
      - name: Build Interception bridge
        shell: pwsh
        run: ./scripts/build-interception-bridge.ps1
      - run: npm run desktop:build -- --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: auto-music-windows-exe
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error

  release:
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      VITE_UPDATE_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Verify signing key
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) { throw '请先设置 GitHub Actions secret TAURI_SIGNING_PRIVATE_KEY' }
      - run: npm ci
      - run: npm test
      - name: Build libvirtualhid bridge
        shell: pwsh
        run: ./scripts/build-lvh-bridge.ps1
      - name: Build Interception bridge
        shell: pwsh
        run: ./scripts/build-interception-bridge.ps1
      - name: Configure release updater
        run: node scripts/write-release-config.mjs
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Auto Music ${{ github.ref_name }}
          releaseDraft: false
          args: --bundles nsis --config src-tauri/tauri.release.conf.json
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
      - name: Make updater downloads public
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $manifestDir = Join-Path $env:RUNNER_TEMP 'auto-music-updater'
          New-Item -ItemType Directory -Path $manifestDir -Force | Out-Null
          gh release download $env:GITHUB_REF_NAME --pattern latest.json --dir $manifestDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $manifestPath = Join-Path $manifestDir 'latest.json'
          node scripts/rewrite-updater-manifest.mjs $manifestPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          gh release upload $env:GITHUB_REF_NAME $manifestPath --clobber
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
